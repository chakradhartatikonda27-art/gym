<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--bg2:#fff;--card:#fff;--cb:#efe9e4;--ink:#1d1512;--mute:#7d726b;--in:#f8f4f1;--a:#f04e23;--ab:#fff;--ok:#12925a;--bad:#d92d20;--warn:#b76e00;--soft:#fff1ea;--grad:linear-gradient(120deg,#ff7a1a,#f04e23 55%,#d7263d)}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.logo b,.kpi .v,.btn,.nav a,.sub a,.qa b,.plan b,.fab{font-family:Poppins,Inter,system-ui,sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--cb)}
.wrap{max-width:1320px;margin:0 auto;padding:0 28px}
.topbar{display:flex;gap:10px;align-items:center;padding:12px 0 8px}.topbar .sp{flex:1}
.logo{display:flex;gap:11px;align-items:center}.logo i{width:40px;height:40px;border-radius:13px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 14px rgba(240,78,35,.3)}
.logo i svg{width:24px}
.logo b{font-size:16px;font-weight:700;display:block;line-height:1.15}.logo b br{display:none}.logo small{color:var(--mute);font-size:12px}
.nav{display:flex;gap:4px;padding:2px 0 10px;overflow:auto}
.nav a{display:flex;align-items:center;gap:8px;padding:9px 15px;border-radius:13px;cursor:pointer;color:var(--mute);font-weight:500;font-size:14px;white-space:nowrap}
.nav a svg,.sub a svg,.qa svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav a:hover{background:var(--in);color:var(--ink)}.nav a.on{background:var(--soft);color:var(--a);font-weight:600}
main{padding-bottom:70px}
.hero{position:relative;overflow:hidden;margin:22px 0 16px;border-radius:26px;background:var(--grad);color:#fff;padding:30px 34px;box-shadow:0 18px 40px rgba(240,78,35,.22)}
.hero::before{content:"";position:absolute;right:-70px;top:-110px;width:340px;height:340px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero::after{content:"";position:absolute;right:150px;bottom:-150px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero small{font-size:13px;font-weight:500;opacity:.9;letter-spacing:.02em}.hero h1{font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:2px 0 16px}
.hero .db{position:absolute;right:46px;top:50%;width:250px;transform:translateY(-50%) rotate(-18deg);opacity:.2;z-index:1}
.tick{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:2}.tick span{background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.22);padding:7px 14px;border-radius:99px;font-size:13px}.tick b{font-weight:700;margin-left:4px}
.sub{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.sub a{padding:9px 17px;border-radius:99px;background:var(--in);color:#5d524b;font-size:13.5px;font-weight:500;cursor:pointer;display:flex;gap:8px;align-items:center}
.sub a:hover{background:#f0e9e4}.sub a.on{background:var(--ink);color:#fff}.sub a.lock{opacity:.5}
.sub a em{font-style:normal;font-size:11px;background:rgba(240,78,35,.14);color:var(--a);border-radius:99px;padding:0 7px;font-family:Inter,sans-serif}.sub a.on em{background:var(--a);color:#fff}
.qa{grid-column:span 12;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.qa a{display:block;border-radius:20px;padding:18px;cursor:pointer;transition:transform .12s}.qa a:hover{transform:translateY(-3px)}
.qa a i{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff;margin-bottom:14px}
.qa b{display:block;font-size:15px;font-weight:600}.qa span{font-size:12.5px;color:#6b5f58}
.search{border:1px solid var(--cb);border-radius:12px;padding:8px 13px;color:var(--mute);cursor:pointer;min-width:240px;display:flex;justify-content:space-between;background:var(--in)}
.search kbd{border:1px solid var(--cb);border-radius:5px;padding:0 6px;font-size:11px;font-family:inherit;background:#fff}
select,input,textarea{background:#fff;color:var(--ink);border:1px solid #e4dcd6;border-radius:11px;padding:9px 12px;font-size:13.5px;font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(240,78,35,.12)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--a);padding:0}
.ib{height:38px;padding:0 14px;border-radius:11px;background:#fff;border:1px solid #e4dcd6;display:inline-grid;place-items:center;cursor:pointer;font-size:13px;font-weight:500;position:relative}.ib .dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--a);border:2px solid #fff}
button{font-family:inherit}.btn{background:var(--grad);color:#fff;border:0;padding:9px 17px;border-radius:12px;font-weight:600;cursor:pointer;font-size:13.5px;box-shadow:0 6px 14px rgba(240,78,35,.22)}
.btn.g{background:#fff;color:var(--ink);border:1px solid #e4dcd6;box-shadow:none}.btn.g:hover{border-color:var(--a);color:var(--a)}.btn.s{padding:6px 12px;font-size:12.5px;border-radius:10px;box-shadow:none}.btn:hover{filter:brightness(1.05)}
.grid{display:grid;gap:18px}.c12{grid-template-columns:repeat(12,1fr)}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
@media(max-width:1100px){.s3,.s4,.s5,.s6,.s7,.s8{grid-column:span 6}}@media(max-width:760px){.s3,.s4,.s5,.s6,.s7,.s8{grid-column:span 12}.hero h1{font-size:26px}.hero .db,.search{display:none}.wrap{padding:0 14px}}
.card{background:#fff;border:1px solid var(--cb);border-radius:22px;padding:22px;position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(60,30,10,.04),0 10px 28px rgba(60,30,10,.05)}
.card h3{font-size:16px;font-weight:600;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}.card h3 small{color:var(--mute);font-weight:400;font-size:12.5px;font-family:Inter,sans-serif}
.kpi{padding:20px 22px;border:0;box-shadow:none}.kpi:nth-child(4n+1){background:#fff1ea}.kpi:nth-child(4n+2){background:#eef3ff}.kpi:nth-child(4n+3){background:#e9f8f0}.kpi:nth-child(4n+4){background:#fff6dc}
.kpi .l{color:#5f544d;font-size:13px;font-weight:500}.kpi .l span:last-child{display:none}.kpi .v{font-size:31px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:10px 0 4px}.kpi .d{font-size:12.5px;font-weight:500}.up{color:var(--ok)}.dn{color:var(--bad)}.kpi svg{display:none}
table{width:100%;border-collapse:collapse}th{color:var(--mute);font-weight:500;font-size:12.5px;text-align:left;padding:8px 10px}td{padding:13px 10px;border-top:1px solid #f4efeb}tr.h:hover td{background:#fff8f4;cursor:pointer}
.pill{padding:3px 11px;border-radius:99px;font-size:12px;font-weight:600;display:inline-block}
.p-ok{background:#e3f6ec;color:var(--ok)}.p-bad{background:#fde8e6;color:var(--bad)}.p-warn{background:#fff1cf;color:var(--warn)}.p-b{background:#eef3ff;color:#3b5bdb}
.av{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;background:var(--soft)!important;color:var(--a);font-weight:700;font-size:12px;vertical-align:middle;margin-right:11px}
.bar{height:8px;border-radius:99px;background:#f3eeea;overflow:hidden}.bar i{display:block;height:100%;background:var(--grad);border-radius:99px}
.mute{color:var(--mute)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:120px}.fl{display:flex;gap:10px;align-items:center}
.feed div{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #f4efeb}.feed div:first-child{border:0}
.live{display:inline-flex;gap:7px;align-items:center;color:var(--ok);font-size:12px;font-weight:600;font-family:Inter,sans-serif}.live:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(18,146,90,.15)}
.ins{display:flex;gap:10px;padding:14px 16px;border-radius:16px;background:var(--in);margin-bottom:10px;align-items:flex-start}.ins .ic{display:none}.ins b{display:block;margin-bottom:2px;font-weight:600}
.kan{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.col{background:var(--in);border-radius:20px;padding:12px;min-height:260px}.col h4{font-size:13.5px;margin:4px 6px 12px;display:flex;justify-content:space-between;font-weight:600}
.col:nth-child(2){background:#eef3ff}.col:nth-child(3){background:#fff6dc}.col:nth-child(4){background:#e9f8f0}
.lead{background:#fff;border:1px solid var(--cb);border-radius:14px;padding:12px;margin-bottom:8px;cursor:grab;box-shadow:0 2px 6px rgba(60,30,10,.04)}
.drawer{position:fixed;top:0;right:-480px;width:450px;max-width:100%;height:100%;background:#fff;z-index:50;padding:26px;overflow:auto;transition:right .22s;border-radius:26px 0 0 26px}.drawer.o{right:0;box-shadow:-20px 0 60px rgba(40,20,10,.18)}
.modal{position:fixed;inset:0;background:rgba(29,21,18,.45);z-index:60;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}.modal.o{display:flex}
.mb{background:#fff;border-radius:20px;width:min(560px,92vw);padding:14px;box-shadow:0 30px 70px rgba(0,0,0,.25)}
.cmd{padding:10px 12px;border-radius:11px;cursor:pointer;display:flex;gap:10px}.cmd:hover{background:var(--soft);color:var(--a)}
.chat{position:fixed;right:24px;bottom:24px;z-index:40}.fab{height:48px;padding:0 22px;border-radius:99px;background:var(--ink);border:0;color:#fff;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 10px 26px rgba(29,21,18,.3)}
.cp{position:absolute;right:0;bottom:60px;width:370px;max-width:92vw;height:470px;background:#fff;border:1px solid var(--cb);border-radius:22px;display:none;flex-direction:column;box-shadow:0 30px 70px rgba(0,0,0,.2);overflow:hidden}.cp.o{display:flex}
.cm{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:9px}.msg{max-width:88%;padding:10px 13px;border-radius:15px;line-height:1.45}.msg.u{align-self:flex-end;background:var(--grad);color:#fff}.msg.a{background:var(--in)}
.chip{display:inline-block;padding:7px 14px;border-radius:99px;background:var(--in);font-size:13px;cursor:pointer;margin:3px;color:#5d524b;font-weight:500}.chip:hover{color:var(--a);background:var(--soft)}
.scan{height:170px;border-radius:18px;background:var(--soft);display:grid;place-items:center;font-size:17px;font-weight:600;color:var(--a);border:2px dashed #ffc9b3}
.res{padding:14px 16px;border-radius:14px;font-weight:600;margin-top:12px}.res.ok{background:#e3f6ec;color:var(--ok)}.res.bad{background:#fde8e6;color:var(--bad)}
.tt{display:grid;grid-template-columns:60px repeat(6,1fr);gap:8px}.tt .h{color:var(--mute);font-size:12.5px;text-align:center;padding:4px;font-weight:500}.slot{background:var(--in);border-radius:13px;padding:9px 11px;font-size:12.5px;min-height:62px;cursor:pointer;border-left:4px solid var(--a)}.slot:hover{background:var(--soft)}
.phone{width:236px;margin:auto;border-radius:34px;border:8px solid var(--ink);background:#fff;padding:16px 13px;box-shadow:0 20px 40px rgba(40,20,10,.18)}
.tog{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #f4efeb}
.sw{width:40px;height:23px;border-radius:99px;background:#ddd5cf;position:relative;cursor:pointer;flex:none}.sw:after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}.sw.on{background:var(--a)}.sw.on:after{left:20px}
.toast{opacity:0;position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(90px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;z-index:99;transition:.22s;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25)}.toast.o{opacity:1;transform:translateX(-50%)}
.heat{display:grid;grid-template-columns:34px repeat(24,1fr);gap:3px;font-size:9.5px;color:var(--mute)}.heat i{aspect-ratio:1;border-radius:4px;display:block}
.plan{border:2px solid var(--cb);border-radius:22px;padding:22px;cursor:pointer;background:#fff}.plan.sel{border-color:var(--a);background:var(--soft)}.plan b.p{font-size:30px;display:block;margin:6px 0;font-weight:700}
code{color:var(--a)}

.side{position:fixed;left:0;top:0;bottom:0;width:232px;background:#fff;border-right:1px solid var(--cb);padding:20px 14px;z-index:30;display:flex;flex-direction:column;overflow:auto}
.side .logo{padding:0 6px 22px}.side .logo b{font-size:14.5px;white-space:nowrap}
.side .nav{flex-direction:column;gap:5px;padding:0;overflow:visible}
.side .nav a{padding:12px 14px;border-radius:14px;font-size:14.5px;gap:12px}
.side .nav a svg{width:19px;height:19px}
.side .nav a.on{background:var(--grad);color:#fff;box-shadow:0 8px 18px rgba(240,78,35,.25)}
.sidefoot{margin-top:auto;background:var(--soft);border-radius:16px;padding:14px}.sidefoot b{display:block;font-family:Poppins,sans-serif;font-size:13.5px;color:var(--a)}.sidefoot span{font-size:12px;color:var(--mute)}
body{padding-left:232px}
.topbar{padding:12px 0}
@media(max-width:900px){body{padding-left:0}.side{position:static;width:auto;border:0;padding:12px 14px 0}.side .nav{flex-direction:row;overflow:auto}.sidefoot{display:none}}

.nl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#a79c95;padding:16px 14px 4px}.nl:first-child{padding-top:0}.nl:empty{display:none}
.side .nav a{padding:10px 14px}
.side .nav a em{margin-left:auto;font-style:normal;font-size:11.5px;font-weight:700;background:var(--a);color:#fff;border-radius:99px;min-width:22px;text-align:center;padding:1px 7px;font-family:Inter,sans-serif}
.side .nav a.hl{background:var(--soft);color:var(--ink);font-weight:600;border:1px solid #ffd9c7}.side .nav a.hl svg{color:var(--a)}
.side .nav a.hl.on{background:var(--grad);color:#fff;border-color:transparent}.side .nav a.hl.on svg{color:#fff}.side .nav a.on em{background:#fff;color:var(--a)}

.sr{display:flex;align-items:center;gap:8px;padding:11px 12px;border:1px solid var(--cb);border-radius:14px;margin-top:8px;cursor:pointer}.sr:hover{border-color:var(--a);background:var(--soft)}
.ptg{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.pt{display:block;border:1px solid var(--cb);border-radius:16px;padding:14px;cursor:pointer;transition:.12s}.pt:hover{border-color:var(--a);background:var(--soft);transform:translateY(-2px)}.pt.off{opacity:.45;pointer-events:none}
.pt b{display:block;font-size:14px;font-weight:600}.pt span{display:block;font-size:12px;color:var(--mute);margin:2px 0 10px}.pt strong{font-family:Poppins,sans-serif;font-size:18px;color:var(--a)}
.bl{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid #f4efeb}.bl input{width:84px;padding:6px 8px}.bl .x{cursor:pointer;color:var(--mute);padding:4px}.bl .x:hover{color:var(--bad)}
.qty{display:flex;align-items:center;gap:8px;background:var(--in);border-radius:99px;padding:3px}.qty a{width:24px;height:24px;border-radius:50%;background:#fff;display:grid;place-items:center;cursor:pointer;font-weight:700;border:1px solid var(--cb)}
@media print{body{padding:0}body>*:not(#drawer){display:none!important}.drawer{position:static;width:100%;box-shadow:none!important;border-radius:0}.np{display:none!important}}
td b{white-space:nowrap}
</style></head>
<body>
<aside class="side"><div class="logo"><i><svg viewBox="0 0 200 80" fill="#fff"><rect x="40" y="33" width="120" height="14" rx="7"/><rect x="24" y="8" width="20" height="64" rx="8"/><rect x="2" y="22" width="16" height="36" rx="6"/><rect x="156" y="8" width="20" height="64" rx="8"/><rect x="182" y="22" width="16" height="36" rx="6"/></svg></i><div><b>Siyantech Gym OS</b><small>FitZone · Gachibowli</small></div></div><nav class="nav" id="nav"></nav><div class="sidefoot" style="cursor:pointer" onclick="$('#cp').classList.add('o')"><b>Need a quick answer?</b><span>Ask the assistant about revenue, renewals or attendance</span></div></aside>
<header><div class="wrap"><div class="topbar"><span class="sp"></span>
<div class="search" onclick="cmd(1)"><span>Search members, pages…</span><kbd>Ctrl K</kbd></div>
<select id="plan" onchange="setPlan(this.value)"><option>Starter</option><option>Professional</option><option selected>Enterprise</option></select>
<select id="role" onchange="setRole(this.value)"><option>Owner</option><option>Receptionist</option><option>Trainer</option></select>
<div class="ib" onclick="toast('3 new alerts: at-risk members · 2 equipment tickets · 5 expiries')" title="Alerts">Alerts<span class="dot"></span></div></div>
</div></header>
<main class="wrap">
<section class="hero"><small id="pgroup"></small><h1 id="ptitle"></h1><div class="tick" id="tick"></div>
<svg class="db" viewBox="0 0 200 80" fill="#fff"><rect x="40" y="35" width="120" height="10" rx="5"/><rect x="24" y="12" width="15" height="56" rx="6"/><rect x="8" y="23" width="13" height="34" rx="5"/><rect x="161" y="12" width="15" height="56" rx="6"/><rect x="179" y="23" width="13" height="34" rx="5"/></svg></section>
<div class="sub" id="sub"></div>
<div id="view"></div></main>

<div class="drawer" id="drawer"></div>
<div class="modal" id="modal" onclick="if(event.target==this)cmd(0)"><div class="mb"><input id="ci" placeholder="Type a page, member name or action…" style="width:100%;margin-bottom:8px" oninput="cmdList()"><div id="cl"></div></div></div>
<div class="chat"><div class="cp" id="cp"><div style="padding:14px;border-bottom:1px solid var(--cb);font-weight:700"> Assistant <span class="live" style="float:right">online</span></div><div class="cm" id="cm"></div>
<div style="padding:0 10px"><span class="chip" onclick="ask('Why did revenue drop?')">Why revenue drop?</span><span class="chip" onclick="ask('Who is at risk of leaving?')">At-risk members</span><span class="chip" onclick="ask('Peak hours?')">Peak hours</span><span class="chip" onclick="ask('Best trainer?')">Top trainer</span></div>
<div style="padding:10px;display:flex;gap:8px"><input id="ai" placeholder="Ask about your gym…" style="flex:1" onkeydown="if(event.key=='Enter')ask()"><button class="btn" onclick="ask()">Send</button></div></div><button class="fab" onclick="$('#cp').classList.toggle('o')">Assistant</button></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s),inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const DAY=864e5,T0=new Date();T0.setHours(0,0,0,0);const addD=(d,n)=>new Date(+d+n*DAY),fmt=d=>new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
let _s=7;const rnd=()=>{_s=(_s*16807)%2147483647;return(_s-1)/2147483646};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('o');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('o'),2400)}
function theme(){const r=document.documentElement;r.dataset.theme=r.dataset.theme=='dark'?'light':'dark';render()}
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const av=n=>`<span class="av" style="background:var(--in)">${n.split(' ').map(x=>x[0]).join('').slice(0,2)}</span>`;

/* ---------- Charts ---------- */
const spark=(a,col='#fff',w=110,h=40)=>{const mx=Math.max(...a),mn=Math.min(...a);const p=a.map((v,i)=>[i*w/(a.length-1),h-4-(v-mn)/(mx-mn||1)*(h-10)]);return`<svg width="${w}" height="${h}"><polyline fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" points="${p.map(x=>x.join(',')).join(' ')}"/></svg>`};
function area(ser,labels,cols,w=620,h=230){const all=ser.flat(),mx=Math.max(...all)*1.1,pl=34,pb=24,W=w-pl,H=h-pb-8;let g='';
 for(let i=0;i<=4;i++){const y=8+H-H*i/4;g+=`<line x1="${pl}" x2="${w}" y1="${y}" y2="${y}" stroke="currentColor" opacity=".08"/><text x="0" y="${y+4}" font-size="10" fill="currentColor" opacity=".5">${Math.round(mx*i/4)}k</text>`}

const dr=$('#drawer');if(!dr)return;dr.innerHTML=`<div class="fl" style="justify-content:space-between"><b>Member 360°</b><span class="ib" onclick="closeD()">✕</span></div><div style="text-align:center;margin:14px 0">${av(m.name).replace('av"','av" ').replace('32px','')}<h2 style="margin-top:8px">${m.name}</h2><div class="mute">${m.id} · ${m.phone} · ${m.tr}</div></div>
<div class="grid" style="grid-template-columns:repeat(3,1fr)"><div class="card" style="padding:12px;text-align:center">${ring(100-risk(m),'#22c55e','Engagement',70)}</div><div class="card" style="padding:12px;text-align:center"><b style="font-size:20px">${inr(m.paid)}</b><div class="mute">Paid of ${inr(m.fee)}</div></div><div class="card" style="padding:12px;text-align:center"><b style="font-size:20px">${dleft(m)}d</b><div class="mute">${dleft(m)<0?'expired':'left'}</div></div></div>
<div class="card" style="margin-top:12px"><h3>Last 28 days attendance <small> ${m.streak} day streak</small></h3><div style="display:grid;grid-template-columns:repeat(14,1fr);gap:4px">${cal}</div></div>
<div class="card" style="margin-top:12px"><h3>Timeline</h3><div class="feed"><div> <span>Check-in ${m.last?m.last+' days ago':'today'}</span></div><div> <span>Last payment ${inr(m.paid)} via UPI</span></div><div> <span>Plan: ${m.goal} (${m.tr})</span></div><div> <span>WhatsApp reminder delivered</span></div></div></div>
<div class="row" style="margin-top:14px"><button class="btn" onclick="renew('${m.id}')">Renew</button><button class="btn g" onclick="frz('${m.id}')"> Freeze 10d</button><button class="btn g" onclick="toast('WhatsApp sent to ${m.name}')"> Message</button></div>`;dr.classList.add('o')}
const closeD=()=>{const d=$('#drawer');if(d)d.classList.remove('o')};
const renew=id=>{const m=members.find(x=>x.id==id);if(!m)return;const b=m.exp<T0?T0:m.exp,info=PD[m.plan]||[1500,30];m.exp=addD(b,info[1]);m.paid=m.fee=info[0];m.last=0;pays.unshift({m:id,a:m.fee,mo:'UPI',t:typeof nowT==='function'?nowT():'now'});toast(m.name+' renewed till '+fmt(m.exp));closeD();render()};
const frz=id=>{const m=members.find(x=>x.id==id);if(!m)return;m.exp=addD(m.exp,10);toast('Frozen 10 days → valid till '+fmt(m.exp));m360(id)};

const REP=['Daily Collection','Monthly Revenue','Total Expenses','Profit & Loss','Cash Flow','Outstanding','Payment Mode','Branch Performance','Trainer Commission','Attendance – Daily','Attendance – Weekly','Attendance – Monthly','Peak Hours','Member-wise Ledger','Lead Conversion','Renewals & Expiry'];
function repData(k){const T=REP[k];if(T=='Daily Collection')return[['Time','Member','Mode','Amount'],pays.map(p=>[p.t,p.m,p.mo,p.a])];if(T=='Monthly Revenue')return[['Month','Revenue'],[['Aug',410000],['Sep',445000],['Oct',462000],['Nov',income()]]];if(T=='Total Expenses')return[['Category','Amount'],exps.map(e=>[e[0],e[1]])];if(T=='Profit & Loss')return[['Item','Amount'],[['Income',income()],['Expenses',spent()],['Operating surplus',income()-spent()]]];if(T=='Cash Flow')return[['Week','Inflow','Outflow'],[['W1',110000,40000],['W2',125000,42000],['W3',118000,41000],['W4',132000,42000]]];if(T=='Outstanding')return[['Member','Dues'],members.filter(m=>due(m)).map(m=>[m.name,due(m)])];if(T=='Payment Mode'){const o={};pays.forEach(p=>o[p.mo]=(o[p.mo]||0)+p.a);return[['Mode','Amount'],Object.entries(o)]}if(T=='Branch Performance')return[['Branch','Revenue','Members'],[['Gachibowli',620000,520],['Kondapur',410000,340],['Madhapur',330000,280]]];if(T=='Trainer Commission')return[['Trainer','Clients','Commission'],TR.map(t=>[t,members.filter(m=>m.tr==t).length,members.filter(m=>m.tr==t).length*850])];if(T.startsWith('Attendance'))return[['Period','Check-ins'],T.includes('Daily')?[['Today',inside.size+95]]:T.includes('Weekly')?[['Mon',142],['Tue',130],['Wed',138]]:[['W1',820],['W2',860],['W3',790]]];if(T=='Peak Hours')return[['Hour','Avg check-ins'],[['6–7 AM',38],['7–8 AM',34],['6–7 PM',41],['7–8 PM',36]]];if(T=='Member-wise Ledger')return[['Member','Fee','Paid','Due'],members.map(m=>[m.name,m.fee,m.paid,due(m)])];if(T=='Lead Conversion')return[['Source','Leads','Converted'],[['Walk-in',12,6],['WhatsApp',9,4],['Website',7,2]]];return[['Member','Expiry'],members.map(m=>[m.name,fmt(m.exp)])]}
V.reports=()=>`<div class="grid c12"><div class="card s4"><h3>Reports & Analytics</h3>${REP.map((r,i)=>`<div class="tog" style="cursor:pointer" onclick="rep(${i})"><span>${r}</span><span class="mute">›</span></div>`).join('')}</div><div class="card s8"><h3 id="rt_t">Select a report</h3><div id="rp" class="mute">Choose a report from the list.</div></div></div>`;

 :`${tbl(['Offer','Code'],offers.map(o=>[o.n,`<span class="pill p-b">${o.c}</span>`]))}<div class="row" style="margin-top:12px">${inp('of_n','Offer name')}${inp('of_c','Code e.g. NEW20')}<button class="btn" style="flex:0 0 auto" onclick="if($('#of_c').value){offers.push({n:$('#of_n').value||$('#of_c').value,c:$('#of_c').value.toUpperCase()});render()}">Add coupon</button></div><p class="mute" style="margin-top:8px">The number in the code is the discount percent.</p>`;
 return`<div class="grid c12">${kpi("Today's collection",inr(tod),pays.length+' payments','up')}${kpi('Invoices today',invs.length,'','')}${kpi('Pending dues',inr(pend),members.filter(due).length+' customers','dn')}${kpi('Average bill',inr(invs.length?invs.reduce((a,v)=>a+v.total,0)/invs.length:0),'','')}
 <div class="s7" style="display:grid;gap:18px;align-content:start"><div class="card" style="overflow:visible"><h3>1. Customer ${m||bNew?'':'<small>search or add new</small>'}</h3>${cust}</div>
 <div class="card"><h3>2. Add items</h3><div style="margin:-4px 0 14px">${tab(bTab,'plans','Membership plans','bTab')}${tab(bTab,'prods','Products','bTab')}${tab(bTab,'fees','Fees & services','bTab')}${tab(bTab,'custom','Custom item','bTab')}</div><div class="ptg">${items}</div></div></div>
 <div class="card s5" style="align-self:start"><h3>3. Bill <small>${m?m.name:'Walk-in customer'}</small></h3>${lines}
 <div class="row" style="margin-top:14px"><input id="b_cp" placeholder="Coupon code" value="${bill.cp}"><button class="btn s g" style="flex:0 0 auto" onclick="bCoupon()">Apply</button></div>
 <div class="row" style="margin-top:8px"><input type="number" placeholder="Discount" value="${bill.disc||''}" onchange="bill.disc=+this.value;bill.cp='';bill.recv=null;render()"><select onchange="bill.dt=this.value;bill.recv=null;render()" style="flex:0 0 70px"><option ${bill.dt=='₹'?'selected':''}>₹</option><option ${bill.dt=='%'?'selected':''}>%</option></select></div>
 <div class="tog" style="margin-top:10px"><span>Subtotal</span><span>${inr(c.sub)}</span></div>${c.d?`<div class="tog"><span>Discount</span><span class="up">– ${inr(c.d)}</span></div>`:''}
 <div class="tog"><span>GST 18%</span><span class="fl">${inr(c.tax)}<div class="sw ${bill.gst?'on':''}" onclick="bill.gst^=1;bill.recv=null;render()"></div></span></div>
 <div class="tog"><b style="font-size:16px">Total</b><b style="font-size:24px;font-family:Poppins,sans-serif">${inr(c.total)}</b></div>
 <div class="mute" style="font-size:12.5px;margin:10px 0 6px">Payment mode</div><div>${MODES.map(mo=>`<a class="chip" style="${bill.mode==mo?'background:var(--a);color:#fff':''}" onclick="bill.mode='${mo}';render()">${mo}</a>`).join('')}</div>
 <div class="row" style="margin-top:12px"><div><div class="mute" style="font-size:12.5px;margin-bottom:4px">Amount received</div><input type="number" value="${c.recv}" onchange="bill.recv=+this.value;render()" style="width:100%"></div><button class="btn s g" style="flex:0 0 auto;align-self:flex-end" onclick="bill.recv=null;render()">Full</button><button class="btn s g" style="flex:0 0 auto;align-self:flex-end" onclick="bill.recv=Math.round(bCalc().total/2);render()">Half</button></div>
 ${c.bal?`<div class="res bad" style="font-weight:500">Balance ${inr(c.bal)} will be added to pending dues</div>`:c.adv?`<div class="res ok" style="font-weight:500">Advance of ${inr(c.adv)} will be credited</div>`:''}
 <input placeholder="Note on invoice (optional)" value="${bill.note}" onchange="bill.note=this.value" style="width:100%;margin-top:10px">
 <div class="row" style="margin-top:14px"><button class="btn" style="flex:3;padding:13px" onclick="bPay()">Collect ${inr(c.recv)} & generate invoice</button><button class="btn g" onclick="bReset();render()">Clear</button></div></div>
 <div class="card s12"><div style="margin-bottom:14px">${tab(bList,'inv','Invoices','bList')}${tab(bList,'dues','Pending dues','bList')}${tab(bList,'shift','Collections by mode','bList')}${tab(bList,'cpn','Coupons','bList')}</div><div style="overflow:auto">${list}</div></div></div>`};
A.billing=()=>{const q=$('#b_q');if(q&&bQ){q.value=bQ;bSearch()}};
/* Price list & stock */
V.inventory=()=>`<div class="grid c12"><div class="card s7"><h3>Products <small>price and stock</small></h3>${tbl(['Product','Price ₹','Stock','',''],prods.map((p,i)=>[p.n,`<input type="number" value="${p.p}" style="width:100px" onchange="prods[${i}].p=+this.value;toast('Price updated')">`,p.s<=5?`<span class="pill p-bad">${p.s} low</span>`:p.s,`<button class="btn s g" onclick="prods[${i}].s+=10;render()">+10 stock</button>`,`<button class="btn s g" onclick="prods.splice(${i},1);render()">Remove</button>`]))}<div class="row" style="margin-top:14px">${inp('np_n','New product name')}${inp('np_p','Price ₹','number')}${inp('np_s','Opening stock','number')}<button class="btn" style="flex:0 0 auto" onclick="npAdd()">Add product</button></div></div>
 <div class="card s5"><h3>Fees & services</h3>${tbl(['Fee','Price ₹'],FEES.map((f,i)=>[f.n,`<input type="number" value="${f.p}" style="width:100px" onchange="FEES[${i}].p=+this.value;toast('Price updated')">`]))}<div class="row" style="margin-top:14px">${inp('nf_n','New fee name')}${inp('nf_p','Price ₹','number')}<button class="btn" style="flex:0 0 auto" onclick="if($('#nf_n').value){FEES.push({n:$('#nf_n').value,p:+$('#nf_p').value||0});render()}">Add</button></div></div>
 <div class="card s12"><h3>Membership plan prices <button class="btn s" onclick="msTab='plans';go('memberships')">+ Add new plan</button></h3>${tbl(['Plan','Duration','Freeze days','Price ₹'],planCat.filter(p=>p.p>0).map(p=>[p.n,p.d+' days',p.f,`<input type="number" value="${p.p}" style="width:110px" onchange="planCat[${planCat.indexOf(p)}].p=+this.value;if(PD['${p.n}'])PD['${p.n}'][0]=+this.value;toast('Price updated')">`]))}</div></div>`;
function npAdd(){const n=$('#np_n').value.trim();if(!n)return toast('Enter product name');prods.push({n,p:+$('#np_p').value||0,s:+$('#np_s').value||0});toast('Product added');render()}
PG.billing[1]='Billing Counter';PG.inventory[1]='Price List & Stock';
render();
/* ---------- Command palette ---------- */
function cmd(o){$('#modal').classList.toggle('o',!!o);if(o){$('#ci').value='';cmdList();setTimeout(()=>$('#ci').focus(),50)}}
function cmdList(){const q=$('#ci').value.toLowerCase();const it=[...Object.keys(PG).filter(p=>ROLE[role].includes(p)).map(p=>['›','Go to '+PG[p][1],`go('${p}')`]),...members.map(m=>['',m.name+' · '+m.id,`cmd(0);m360('${m.id}')`]),['','Ask AI assistant',"cmd(0);$('#cp').classList.add('o')"]];
 $('#cl').innerHTML=it.filter(x=>x[1].toLowerCase().includes(q)).slice(0,8).map(x=>`<div class="cmd" onclick="${x[2]}"><span>${x[0]}</span>${x[1]}</div>`).join('')||'<div class="mute" style="padding:10px">No results</div>'}
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key=='k'){e.preventDefault();cmd(1)}if(e.key=='Escape'){cmd(0);closeD()}});

/* ---------- AI assistant ---------- */
function say(t,c){const d=document.createElement('div');d.className='msg '+c;$('#cm').appendChild(d);if(c=='u'){d.textContent=t}else{let i=0;const f=()=>{d.innerHTML=t.slice(0,i);i+=3;$('#cm').scrollTop=1e5;if(i<t.length+3)setTimeout(f,12)};f()}$('#cm').scrollTop=1e5}
function ask(q){q=q||$('#ai').value;if(!q.trim())return;$('#ai').value='';say(q,'u');const l=q.toLowerCase(),rk=members.filter(m=>risk(m)>=60);let a='I can analyse attendance, revenue, renewals, equipment and trainers. Try “Why did revenue drop?”';
 if(/revenue|drop|income/.test(l))a='Revenue is <b>up 8.1%</b> vs October, but 3 factors cap growth: <br>① '+rk.length+' high-risk members (≈₹'+(rk.length*1500).toLocaleString('en-IN')+'/mo at stake)<br>② 5 renewals due this week<br>③ ₹15,000 pending dues. <br> Run the win-back campaign + dues reminders.';
 else if(/risk|leav|churn|inactive/.test(l))a='<b>'+rk.length+' members</b> at high risk: '+rk.slice(0,4).map(m=>m.name).join(', ')+'… <br>Open <b>Retention AI</b> to send personalised nudges.';
 else if(/peak|busy|hour/.test(l))a='Peak hours: <b>6–9 AM</b> and <b>5–9 PM</b>. 3–4 PM is under 30% — good for an off-peak offer.';
 else if(/trainer|coach/.test(l))a=' <b>Coach Raju</b> leads: 88% retention, 92% session completion, 80% feedback score.';
 else if(/equip|repair|machine/.test(l))a='2 assets need attention: <b>Leg Press</b> (out of service, warranty expired) and <b>Cable Machine</b> (under maintenance).';
 else if(/profit|expense|surplus/.test(l))a='Operating surplus this month: <b>'+inr(income()-spent())+'</b> (income '+inr(income())+' − expenses '+inr(spent())+'). Rent + salaries = 68% of costs.';
 setTimeout(()=>say(a,'a'),400)}
say('Hi! I\'m your Gym AI. Ask me about revenue, churn, peak hours, trainers or equipment.','a');
render();
</script></body></html>
